name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo. A compromised step cannot push.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned, not tagged: a moved tag would otherwise run
      # unreviewed code with the job's token. Version in the trailing comment.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run test
      - run: bun run build
      - name: build smoke
        run: bun scripts/smoke-dist.ts
      # The real-eval regression gate (bun run eval:real:check) needs a built curtain
      # model. The model is built locally from the train/ pipeline, not fetched, so CI
      # has no model to load; run the gate locally with CURTAIN_MODEL set to a built
      # model before shipping model or pipeline changes.
